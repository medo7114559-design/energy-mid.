<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشمش 🐈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐈</text></svg>">
<style>
:root{--bg:#fff1e2;--card:#fffaf4;--ink:#3b2a1e;--mut:#7d6552;--acc:#b85a1a;--on:#fff;--ok:#2f7d3a;--okb:#e6f2dc;--no:#b3261e;--nob:#fde4df;--bd:#f0cfae}
@media(prefers-color-scheme:dark){:root{--bg:#1f1510;--card:#2a1d15;--ink:#f7e6d6;--mut:#c4a68c;--acc:#f4a261;--on:#1f1510;--ok:#9ad48a;--okb:#233318;--no:#ff9a8f;--nob:#3d1d18;--bd:#4a3426}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin-bottom:8px}
.sec{font-weight:600;color:var(--acc)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc)}
.card{background-color:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.cat{background-repeat:no-repeat;background-position:right 6px bottom 6px;background-size:210px auto}
.q{font-size:18px;font-weight:600;margin:0 0 14px;white-space:pre-line}
.opt{display:flex;gap:10px;width:100%;text-align:start;background:color-mix(in srgb,var(--card) 72%,transparent);color:var(--ink);border:1.5px solid var(--bd);border-radius:8px;padding:12px;margin:0 0 8px;font:inherit;cursor:pointer}
.opt b{flex:none;width:24px;color:var(--acc)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.ex{margin-top:12px;padding:12px;border-radius:8px;white-space:pre-line;border-inline-start:4px solid var(--acc);background:var(--bg)}
.ex strong{display:block;margin-bottom:4px}
.ex.ok{border-color:var(--ok)}.ex.no{border-color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:1.5px solid var(--acc);background:var(--acc);color:var(--on);cursor:pointer}
.btn.g{background:none;color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.score{font-size:44px;font-weight:700;color:var(--acc);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{font:inherit;padding:4px 10px;border-radius:14px;border:1.5px solid var(--no);background:var(--nob);color:var(--ink);cursor:pointer}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--acc);margin-bottom:12px}
.brand span{font-size:26px;line-height:1}
.hero{text-align:center;padding:48px 20px;margin-top:40px}
.hero .note{font-size:14px;margin:-12px 0 24px}
.hero h1{font-size:46px;margin:0 0 30px}
.hero p{color:var(--mut);margin:0 0 28px}
.hero .btn{font-size:18px;padding:12px 44px}
.fig{background:#fff;border-radius:10px;padding:8px;margin:0 0 14px;display:flex;justify-content:center;direction:ltr}
.fig svg{max-width:100%;height:auto}
</style>
</head>
<body>
<main id="app"></main>

const RAW=[{"lec": 1, "t": "mcq", "q": "Energy is scientifically defined as:", "o": ["The rate of heat transfer", "The capability to do work", "A form of metallic material", "A material that fuels combustion"], "a": 1}, {"lec": 1, "t": "mcq", "q": "Energy conversion is the process of:", "o": ["changing radiant energy to electrical energy", "changing thermal energy to mechanical energy", "changing energy from one form to another", "None of the other answers"], "a": 2}, {"lec": 1, "t": "mcq", "q": "According to the law of conservation of energy:", "o": ["the quantity of energy in the universe keeps increasing", "energy is destroyed when it is used", "the quantity of energy in the universe remains constant", "energy can be created in power plants"], "a": 2}, {"lec": 1, "t": "mcq", "q": "A generator converts ……… to ……… with by-products of ……… and ………", "o": ["Electrical – Mechanical – Heat – Light", "Mechanical – Electrical – Heat – Sound", "Chemical – Electrical – Heat – Light", "Mechanical – Chemical – Heat – Sound"], "a": 1}, {"lec": 1, "t": "mcq", "q": "A television converts electrical energy into:", "o": ["mechanical energy, with heat as a by-product", "chemical energy and heat", "light and sound energy, with heat as a by-product", "light energy only, with no by-product"], "a": 2}, {"lec": 1, "t": "mcq", "q": "The energy conversion in a battery flashlight is:", "o": ["Electrical → Chemical → Light", "Chemical → Electrical → Light", "Light → Electrical → Chemical", "Mechanical → Electrical → Light"], "a": 1}, {"lec": 1, "t": "mcq", "q": "Water stored behind a dam has ……… energy, and when it flows through the gate it has ……… energy.", "o": ["kinetic, then potential", "chemical, then thermal", "thermal, then radiant", "potential, then kinetic"], "a": 3}, {"lec": 1, "t": "mcq", "q": "A solar cell converts ……… energy into ……… energy.", "o": ["light → electrical", "electrical → light", "heat → mechanical", "chemical → electrical"], "a": 0}, {"lec": 1, "t": "mcq", "q": "A {"lec": 3, "t": "mcq", "q": "Step-up transformers are connected between:", "o": ["Transmission and distribution", "Generation and transmission", "Distribution and the consumer", "The turbine and the generator"], "a": 1}, {"lec": 3, "t": "mcq", "q": "Figure 1: The function of component 1 is:", "o": ["Generate electricity", "Convert water into steam", "Raise the voltage", "Transmit electricity"], "a": 2, "fig": true}, {"lec": 3, "t": "mcq", "q": "Figure 1: The title of component 4 is:", "o": ["Transmission system", "Generation system", "Sub-transmission system", "Distribution system"], "a": 3, "fig": true}, {"lec": 3, "t": "mcq", "q": "In a steam power station, the turbine converts the heat energy of steam into:", "o": ["Electrical energy", "Mechanical energy", "Chemical energy", "Nuclear energy"], "a": 1}, {"lec": 3, "t": "mcq", "q": "Which of the following is a major challenge for the electric industry?", "o": ["Decrease in the demand for electricity", "Excess electricity generation capacity", "Integrating increasing amounts of renewable energy into the grid", "Low electricity prices"], "a": 2}, {"lec": 3, "t": "mcq", "q": "The five features of electrical energy: convenient form, cleanliness, easy control, ……… and easy to transmit.", "o": ["high cost", "cheapness", "easy storage", "noise"], "a": 1}, {"lec": 3, "t": "mcq", "q": "The generation voltage is ……… and the transmission voltage is ………", "o": ["66–500 kV / 11–25 kV", "220 V / 380 V", "6.6 kV / 33 kV", "11–25 kV / 66–500 kV"], "a": 3}, {"lec": 3, "t": "mcq", "q": "One challenge of the electric industry is tackling ……… due to electric power systems.", "o": ["population growth", "oil prices", "climate change", "wind speed"], "a": 2}, {"lec": 3, "t": "mcq", "q": "With more focus on environmental performance, government legislation is expected to:", "o": ["continue to tighten worldwide", "be relaxed", "disappear", "stay unchanged"], "a": 0}, {"lec": 3, "t": "mcq", "q": "Many countries restructure the electricity sector toward:", "o": ["full government control only", "stopping generation", "more dependence on the private and investment sector", "closing the grids"], "a": 2}, {"lec": 3, "t": "mcq", "q": "For developing and poor countries, the challenge of old infrastructure is how to modernize it:", "o": ["with maximum cost", "with minimum cost", "by removing it completely", "by stopping demand"], "a": 1}, {"lec": 4, "t": "mcq", "q": "Burning fossil fuels releases carbon dioxide, which increases ………", "o": ["global cooling", "global warming", "sea salinity", "wind speed"], "a": 1}, {"lec": 4, "t": "mcq", "q": "Ozone, sulfur dioxide and NO₂ from burning fossil fuels contribute to ………", "o": ["smog and acid rain", "rising sea levels", "volcanic activity", "solar variability"], "a": 0}, {"lec": 4, "t": "mcq", "q": "Very tall flue-gas stacks:", "o": ["solve global warming", "remove CO₂ from the air", "reduce local impacts but do not help global issues", "increase the plant efficiency"], "a": 2}, {"lec": 4, "t": "mcq", "q": "Which technology prevents CO₂ from going into the atmosphere?", "o": ["Carbon capture", "Tall stacks", "Cooling towers", "Longer pipelines"], "a": 0}, {"lec": 4, "t": "mcq", "q": "Co-generation (combined heat and power) saves fuel because:", "o": ["it burns less coal only", "the waste heat is used for heating nearby buildings", "it removes SO₂", "it stores electricity"], "a": 1}, {"lec": 4, "t": "mcq", "q": "Thermal stations (steam, gas turbine, nuclear, geothermal, biomass) use water mainly as ………", "o": ["a fuel", "a cooling fluid", "an insulator", "a lubricant"], "a": 1}, {"lec": 4, "t": "mcq", "q": "Water use of hydroelectricity comes mainly from ………", "o": ["evaporation from the reservoirs", "cooling towers", "boiler losses", "cleaning blades"], "a": 0}, {"lec": 4, "t": "mcq", "q": "Electricity from renewable sources produces about ……… less greenhouse gases than coal-fired plants.", "o": ["10–20%", "30–40%", "50–60%", "90–99%"], "a": 3}, {"lec": 4, "t": "mcq", "q": "Which is an environmental impact of hydropower plants?", "o": ["Reservoirs may cover homes, farmland and archaeological sites", "Large SO₂ emissions", "Radioactive waste", "Burning of coal"], "a": 0}, {"lec": 4, "t": "mcq", "q": "Hydropower reservoirs release greenhouse gases because:", "o": ["organic material such as dead plants breaks down in them", "turbines burn fuel", "water reflects sunlight", "dams produce smoke"], "a": 0}, {"lec": 4, "t": "mcq", "q": "Climate change describes a change in ……… over a long period of time.", "o": ["the Earth’s rotation", "the average conditions such as temperature and rainfall", "the Sun’s size", "the number of seasons"], "a": 1}, {"lec": 4, "t": "mcq", "q": "Which of the following is NOT an effect of Earth’s warming?", "o": ["Rising sea levels", "Shrinking mountain glaciers", "Faster ice melting", "Decreasing sea levels"], "a": 3}, {"lec": 4, "t": "mcq", "q": "Which of the following is NOT one of the main causes of climate change?", "o": ["Solar variability", "Volcanic activity", "Tidal energy", "Human activities"], "a": 2}, {"lec": 4, "t": "mcq", "q": "Volcanic eruptions can reduce the solar radiation reaching Earth by releasing ………", "o": ["oxygen", "sulfur dioxide and aerosols", "nitrogen only", "hydrogen"], "a": 1}, {"lec": 4, "t": "mcq", "q": "The most important greenhouse gases are:", "o": ["oxygen, nitrogen and argon", "carbon dioxide, methane and water vapor", "helium and neon", "hydrogen and oxygen"], "a": 1}, {"lec": 4, "t": "mcq", "q": "Higher temperatures cause many disasters such as:", "o": ["earthquakes and tsunamis", "storms, heatwaves, floods and droughts", "volcanoes only", "none of them"], "a": 1}, {"lec": 5, "t": "mcq", "q": "Green energy is energy that comes from ………", "o": ["natural sources", "burning coal", "nuclear reactions", "petroleum"], "a": 0}, {"lec": 5, "t": "mcq", "q": "Clean energy is energy that does not release ……… into the air.", "o": ["water", "light", "pollutants", "heat"], "a": 2}, {"lec": 5, "t": "mcq", "q": "No power plant is completely ………", "o": ["old", "clean or green", "expensive", "large"], "a": 1}, {"lec": 5, "t": "mcq", "q": "Sustainable energy can be utilized ……… without putting the source in danger of depletion.", "o": ["only once", "for a few years", "again and again", "only at night"], "a": 2}, {"lec": 5, "t": "mcq", "q": "Egypt’s renewable energy target for 2022 was:", "o": ["10%", "20%", "37.2%", "42%"], "a": 1}, {"lec": 5, "t": "mcq", "q": "The Egyptian Energy Strategy until 2035 aims to reach a renewable contribution of:", "o": ["20%", "25%", "37.2%", "60%"], "a": 2}, {"lec": 5, "t": "mcq", "q": "Wind power was used in Egypt as early as 5,000 BC to:", "o": ["grind wheat", "pump water", "generate electricity", "propel boats along the Nile"], "a": 3}, {"lec": 5, "t": "mcq", "q": "The first electricity-generating wind turbine was installed in:", "o": ["Cairo 1950", "Vienna 1883", "Tokyo 1932", "London 1973"], "a": 1}, {"lec": 5, "t": "mcq", "q": "The 1973 ……… pushed the USA and Europe to develop utility-scale wind generators.", "o": ["oil crisis", "steam machine", "world war", "solar eclipse"], "a": 0}, {"lec": 5, "t": "mcq", "q": "Wind is caused by ………", "o": ["the rotation of the Moon", "the uneven heating of the Earth by the sun", "ocean tides only", "earthquakes"], "a": 1}, {"lec": 5, "t": "mcq", "q": "Which is an advantage of wind energy?", "o": ["It is cost-effective for large-size wind farms", "It is uncontrollable", "It is noisy", "It affects TV reception"], "a": 0}, {"lec": 5, "t": "mcq", "q": "Which is a challenge of wind energy?", "o": ["It is an uncontrollable and intermittent source", "It is clean", "It is plentiful", "It is a domestic source"], "a": 0}, {"lec": 5, "t": "mcq", "q": "CO₂ emissions of wind power come mainly from:", "o": ["burning wind", "concrete manufacturing for the turbine foundations", "the blades’ rotation", "the wind itself"], "a": 1}, {"lec": 5, "t": "mcq", "q": "Wind turbines threaten wildlife because birds and other flying animals can:", "o": ["be hit by a rotating blade", "eat the blades", "lose their food", "be burned"], "a": 0}, {"lec": 1, "t": "tf", "q": "Energy can be created in power plants.", "a": false}, {"lec": 2, "t": "tf", "q": "Nuclear energy is a renewable energy source.", "a": false}, {"lec": 3, "t": "tf", "q": "Power stations must produce power as and when it is demanded.", "a": true}, {"lec": 4, "t": "tf", "q": "Wind power uses almost no water compared with other power sources.", "a": true}, {"lec": 4, "t": "tf", "q": "2023 was the warmest year on Earth since 1850.", "a": true}, {"lec": 5, "t": "tf", "q": "Wind turbines produce no carbon dioxide or other air pollution during operation.", "a": true}, {"lec": 5, "t": "tf", "q": "A land breeze flows from water to land late at night.", "a": false}];
const EXP=["Energy = القدرة على بذل شغل (capability to do work). الـ rate of heat transfer ده معدل انتقال الحرارة مش تعريف الطاقة.", "Energy conversion معناها تحويل الطاقة من شكل لشكل تاني. الاختيارات التانية مجرد أمثلة على التحويل مش التعريف كله.", "قانون Conservation of energy: كمية الطاقة في الكون ثابتة، مبتتخلقش ومبتفنيش، بتتحول من شكل لشكل بس.", "الـ generator بياخد طاقة ميكانيكية (دوران التوربين) ويطلّع كهربا، والـ by-products بتبقى heat و sound.", "التليفزيون بياخد electrical ويحولها لـ light و sound، والـ heat بتبقى by-product (بتحس بيها في ضهر الجهاز).", "البطارية فيها chemical energy بتتحول لـ electrical، والكهربا بتتحول في اللمبة لـ light. الترتيب: Chemical → Electrical → Light.", "الميه المخزنة ورا السد معاها potential energy (طاقة وضع)، ولما تنزل من البوابة بتتحول لـ kinetic energy (حركة).", "الـ solar cell بياخد الضوء (light) ويحوله مباشرة لكهربا (electrical).", "الرياح بتلف الريش (طاقة ميكانيكية) والـ generator المتوصل بيها بيحولها لكهربا. فالتحويل هنا Mechanical → Electrical.", "قانون التحويل: input → conversion → useful output + energy loss. الـ loss (غالبًا heat) مفيش تحويل من غيره، ومفيش طاقة جديدة بتتولد.", "Uranium (nuclear) هو الـ non-renewable لأنه كمية محدودة ومبيتجددش. الـ wind و biomass و hydropower كلهم renewable.", "سميت renewable لأنها بتتجدد طبيعيًا بمعدل ثابت (شمس، رياح، ميه). اللي كميتها محدودة وبتخلص هي الـ non-renewable.", "حسب المحاضرة الـ non-renewable sources (فحم، بترول، غاز) متوقع تخلص بعد حوالي 50–60 سنة.", "أكبر عيب في الـ renewable إن supply مش مضمون (unreliable): الشمس مفيش بالليل، والرياح بتتغير. هي مش polluting أصلًا.", "ميزة الـ non-renewable إنها cheap and easy to use. باقي الاختيارات غلط: كميتها محدودة، وCO₂ بتاعها عالي.", "الـ solar energy بتتستخدم بالنهار بس، مفيش بالليل ولا في موسم المطر. مبتطلعش toxic gases ومحتاجة مش dam ولا مرتبطة بالقمر.", "من عوامل مشكلة الطاقة في العالم زيادة عدد السكان (increasing of the world population) لأن الطلب بيزيد.", "المشكلة بتحصل لما TES (الإمداد الكلي) أقل من TFC (الاستهلاك النهائي)
